# Add this file to the repo at: .github/workflows/publish-mcp.yml
# It publishes server.json (repo root) to the official MCP Registry using GitHub
# Actions OIDC — no interactive login, no secrets, no personal/org account juggling.
# Triggers on a version tag push (v*) and can be run manually from the Actions tab.

name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC auth to the registry
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Validate server.json
        run: mcp-publisher validate

      - name: Authenticate (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish
        run: mcp-publisher publish

      - name: Verify
        run: curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=adology"
